<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Bell Gradients -->
    <linearGradient id="bell_face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B" />
      <stop offset="100%" stop-color="#FBC02D" />
    </linearGradient>
    <linearGradient id="bell_side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <filter id="soft_shadow" x="-20%" y="-20%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Triangle Gradients -->
    <linearGradient id="tri_face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
    <linearGradient id="tri_side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <!-- Platform Gradients -->
    <linearGradient id="plat_top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECEFF1" />
    </linearGradient>
    <linearGradient id="plat_side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFD8DC" />
      <stop offset="100%" stop-color="#B0BEC5" />
    </linearGradient>
  </defs>

  <!-- Background (Optional, keeping it clean) -->
  <rect width="800" height="600" fill="#F5F7FA" />

  <!-- LEFT ICON: BELL -->
  <g transform="translate(100, 350)">
    <!-- Platform -->
    <rect x="0" y="50" width="250" height="150" rx="20" fill="url(#plat_side)" transform="skewX(-20)" />
    <rect x="10" y="40" width="250" height="150" rx="20" fill="url(#plat_top)" transform="skewX(-20)" />
    
    <!-- 3D Bell -->
    <g transform="translate(80, -100) scale(1.2) skewX(-10)">
      <!-- Bell Body -->
      <path d="M50 0 C20 0 0 30 0 60 L100 60 C100 30 80 0 50 0 Z" fill="url(#bell_face)" filter="url(#soft_shadow)" />
      <!-- Bell Bottom Lip -->
      <path d="M-10 60 L110 60 L110 75 L-10 75 Z" fill="#FBC02D" />
      <!-- Bell Small Clapper -->
      <circle cx="50" cy="85" r="15" fill="#FBC02D" />
      
      <!-- 'i' Symbol -->
      <rect x="45" y="25" width="10" height="25" fill="#827717" rx="2" />
      <circle cx="50" cy="18" r="5" fill="#827717" />
      
      <!-- Gloss effect -->
      <path d="M20 15 Q30 5 50 5" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    </g>
  </g>

  <!-- RIGHT ICON: TRIANGLE -->
  <g transform="translate(450, 350)">
    <!-- Platform -->
    <rect x="0" y="50" width="250" height="150" rx="20" fill="url(#plat_side)" transform="skewX(-20)" />
    <rect x="10" y="40" width="250" height="150" rx="20" fill="url(#plat_top)" transform="skewX(-20)" />

    <!-- 3D Triangle -->
    <g transform="translate(80, -120) scale(1.2) skewX(-10)">
      <!-- Triangle Side (Depth) -->
      <path d="M50 10 L100 110 L0 110 Z" fill="url(#tri_side)" transform="translate(10, 10)" />
      <!-- Triangle Face -->
      <path d="M50 0 L100 100 L0 100 Z" fill="url(#tri_face)" filter="url(#soft_shadow)" />
      
      <!-- '!' Symbol -->
      <rect x="45" y="30" width="10" height="40" fill="#3E2723" rx="2" />
      <circle cx="50" cy="80" r="6" fill="#3E2723" />
      
      <!-- Gloss effect -->
      <path d="M30 30 L45 10" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.3" />
    </g>
  </g>
</svg>
